channels:
  - conda-forge
dependencies:
  - cclib
  - dftd4-python
  - geometric
  - libconeangle
  - matplotlib
  - openbabel
  - pip
  - pymeshfix
  - python>=3.10
  - pyvista
  - pyvistaqt
  - qcengine
  - rdkit
  - spyrmsd
  - vtk
  # xtb pinned to build 4 of 6.7.1 because build 5 is installed next to a new `multicharge`
  # build it was not compiled against, which makes PTB calculations with xtb segfault
  - xtb=6.7.1=*_4
  - xtb-python
  - pip:
      - pyberny
